name: CI

# ghcr-only (Harbor decommissioned 2026-11-16). Builds the custom Open WebUI image to ghcr, signs it
# (keyless cosign) + SBOM, then bumps the deployed tag in minicloud-gitops. No Tailscale/Harbor/CA.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GHCR_IMAGE: ghcr.io/andrelair-platform/open-webui
  GITOPS_REPO: andrelair-platform/minicloud-gitops

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "image_tag=${SHA}-amd64" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        # Use GITOPS_TOKEN (write:packages PAT), NOT the repo-scoped GITHUB_TOKEN: these packages were
        # crane-copied during the Harbor decommission so they're LINKED to minicloud-gitops, and a
        # repo-scoped token gets permission_denied. A write:packages PAT pushes to any org package.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: AndreLiar
          password: ${{ secrets.GITOPS_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push to ghcr
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            CA_CERT=${{ secrets.MINICLOUD_CA_CERT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          timeout: 15m

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Sign image + attach SBOM (keyless)
        run: |
          cosign sign --yes "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          syft "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}" -o cyclonedx-json=sbom.json
          cosign attach sbom --sbom sbom.json --type cyclonedx "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"

  bump-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout minicloud-gitops
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Bump tag in open-webui-values.yaml (repository already ghcr)
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          F=helm-values/minicloud-1/open-webui-values.yaml
          sed -i "s|^  tag: .*|  tag: \"${NEW_TAG}\"|" "$F"
          git add "$F"
          if git diff --cached --quiet; then echo "No change — already at ${NEW_TAG}"; exit 0; fi
          BRANCH="ci/open-webui-bump-${NEW_TAG}"
          git checkout -b "${BRANCH}"
          git commit -S -m "ci(open-webui): bump image to ${NEW_TAG}"
          git push origin "${BRANCH}"
          gh pr create --repo "${{ env.GITOPS_REPO }}" --title "ci(open-webui): bump image to ${NEW_TAG}" \
            --body "Automated image bump from CI (ghcr)." --head "${BRANCH}" --base main
          gh pr merge --repo "${{ env.GITOPS_REPO }}" --admin --squash --delete-branch "${BRANCH}"
